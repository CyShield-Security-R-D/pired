<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="pired — security assessment harness">
  <title>pired — security assessment harness</title>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d75f5f"/>
      <stop offset="100%" stop-color="#ff5f5f"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5f5f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff5f5f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5f5f" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff5f5f" stop-opacity="0"/>
    </linearGradient>
    <style>
      .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    </style>
  </defs>

  <!-- ground -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="#121212" stroke="#2b2b2b"/>
  <rect x="1" y="1" width="1198" height="150" rx="15" fill="url(#glow)"/>

  <!-- wordmark -->
  <text class="m" x="64" y="132" font-size="72" font-weight="700" letter-spacing="-1">
    <tspan fill="#dcdcdc">pi</tspan><tspan fill="#ff5f5f">red</tspan>
  </text>
  <rect x="66" y="156" width="232" height="2" fill="url(#rule)"/>

  <text class="m" x="64" y="196" font-size="18" fill="#b4b4b4">security assessment harness</text>

  <!-- profile chips -->
  <g class="m" font-size="14">
    <rect x="64"  y="228" width="104" height="32" rx="8" fill="#1d1616" stroke="#4a2f2f"/>
    <text x="116" y="249" fill="#ff8f8f" text-anchor="middle">review</text>
    <rect x="178" y="228" width="104" height="32" rx="8" fill="#1a1a1a" stroke="#3a3a3a"/>
    <text x="230" y="249" fill="#9a9a9a" text-anchor="middle">recon</text>
    <rect x="292" y="228" width="104" height="32" rx="8" fill="#1a1a1a" stroke="#3a3a3a"/>
    <text x="344" y="249" fill="#9a9a9a" text-anchor="middle">pentest</text>
    <text x="418" y="249" fill="#5f5f5f">runs on your own hardware</text>
  </g>

  <!-- engagement panel, as the tool actually draws it -->
  <g>
    <rect x="756.5" y="48.5" width="379" height="223" rx="10" fill="#171717" stroke="#3a3a3a"/>

    <circle cx="782" cy="76" r="6" fill="none" stroke="#ff5f5f" stroke-width="1.5"/>
    <circle cx="782" cy="76" r="2.5" fill="#ff5f5f"/>
    <text class="m" x="798" y="81" font-size="15" fill="#dcdcdc">acme-webapp</text>
    <text class="m" x="798" y="100" font-size="11" fill="#6c6c6c">pentest · web application</text>

    <line x1="772" y1="116" x2="1120" y2="116" stroke="#2a2a2a"/>

    <text class="m" x="772" y="140" font-size="11" fill="#8a8a8a">coverage</text>
    <text class="m" x="1120" y="140" font-size="11" fill="#dcdcdc" text-anchor="end">62%</text>
    <rect x="772" y="150" width="348" height="10" rx="5" fill="#262626"/>
    <rect x="772" y="150" width="216" height="10" rx="5" fill="url(#bar)"/>
    <text class="m" x="772" y="180" font-size="11" fill="#6c6c6c">105 of 170 cells · 65 gaps</text>

    <line x1="772" y1="196" x2="1120" y2="196" stroke="#2a2a2a"/>

    <g class="m" font-size="11">
      <circle cx="777" cy="216" r="4.5" fill="#ff5f5f"/>
      <text x="789" y="220" fill="#b4b4b4">crit 1</text>
      <circle cx="847" cy="216" r="4.5" fill="#d75f5f"/>
      <text x="859" y="220" fill="#b4b4b4">high 2</text>
      <circle cx="925" cy="216" r="4.5" fill="#e5c07b"/>
      <text x="937" y="220" fill="#b4b4b4">med 3</text>
    </g>
    <text class="m" x="772" y="248" font-size="11" fill="#7c7c7c">▸ SQLi in /api/transfer amount</text>
  </g>
</svg>
